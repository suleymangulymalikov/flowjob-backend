# Local development database only. Never used for production.
services:
  db:
    image: postgres:16
    container_name: flowjob-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowjob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-flowjob_dev}
      # Read by docker/postgres/init/01-create-test-db.sh
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-flowjob_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flowjob_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flowjob_pgdata:
