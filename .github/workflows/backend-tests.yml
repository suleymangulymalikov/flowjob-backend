name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    container: mongo:8.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: FLOWJOB_TEST_MONGOD=mongod uv run --locked pytest
