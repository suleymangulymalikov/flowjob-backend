[project]
name = "flowjob-backend"
version = "0.1.0"
description = "FastAPI backend for FlowJob"
requires-python = ">=3.12"
dependencies = [
    "beanie>=2.2.0",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
